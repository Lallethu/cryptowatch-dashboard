<div>
  <div class="bg-top" aria-hidden="true"></div>
  <header>
    <div class="header-titles">
      <h1>Crypto<span class="header-accent">Watch</span></h1>
      <h2>Dashboard</h2>
    </div>

    <div class="header-actions">
      <div class="status-badge" [attr.data-status]="backendStatus()">
        <span class="status-dot"></span>
        <span class="status-label">{{ backendStatus() }}</span>
      </div>

      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (isDark() ? 'light' : 'dark') + ' mode'"
      >
        {{ isDark() ? '☀️' : '🌙' }}
      </button>
    </div>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
