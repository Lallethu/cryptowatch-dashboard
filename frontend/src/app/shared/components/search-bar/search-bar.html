<div class="search-bar">
  <span class="search-icon">🔍</span>
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Find a crypto..."
    class="search-input"
  />
  @if (searchControl.value) {
    <button class="search-clear" (click)="searchControl.reset()">✕</button>
  }
</div>
